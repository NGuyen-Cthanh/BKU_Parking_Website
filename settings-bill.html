<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>BKU Parking | Billing</title>
  <link rel="stylesheet" href="styles/main.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="scripts/i18n.js?v=20260424-06" defer></script>
  <script src="scripts/site.js?v=20260424-06" defer></script>
</head>
<body class="settings-body" data-page="settings-bill">
  <div class="dashboard-shell">
    <aside class="sidebar">
      <a class="brand sidebar-brand" href="index.html" aria-label="BKU Parking home">
        <img class="brand-mark" src="./assets/images/logo.png" alt="BKU logo">
        <span class="brand-text">BKU Parking</span>
      </a>

      <div class="sidebar-avatar">
        <span>J</span>
      </div>

      <label class="sidebar-search">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5"></circle>
          <path d="m16 16 4 4"></path>
        </svg>
        <input type="search" placeholder="Search for...">
      </label>

      <nav class="sidebar-nav" aria-label="Dashboard navigation">
        <a href="settings-home.html" class="nav-item">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V20H4Z"></path></svg>
          </span>
          <span>Home</span>
        </a>
        <a href="settings-bill.html" class="nav-item is-active">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16l-3-2-3 2-3-2-3 2Z"></path></svg>
          </span>
          <span>Bill</span>
        </a>
        <a href="settings-home.html" class="nav-item">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.8 14.8 5l3.1-.5.9 3 2.4 2-1.8 2.6.3 3.1-3 .9-1.9 2.4-2.8-1.2-2.8 1.2-1.9-2.4-3-.9.3-3.1L2.8 9.5l2.4-2 .9-3 3.1.5Z"></path></svg>
          </span>
          <span>Setting</span>
          <span class="nav-badge">99+</span>
          <span class="nav-chevron">⌄</span>
        </a>
      </nav>
    </aside>

    <main class="dashboard-content">
      <section class="dashboard-header">
        <h1>Settings</h1>
      </section>

      <section class="summary-grid">
        <article class="summary-card">
          <span>Parking fee this semester (until now)</span>
          <strong id="billing-semester-total">--</strong>
        </article>
        <article class="summary-card">
          <span>Parking fee last semester </span>
          <strong id="billing-last-semester-total">--</strong>
        </article>
        <article class="summary-card">
          <span>Active time</span>
          <strong id="billing-active-time">--</strong>
        </article>
      </section>

      <section class="panel panel-table">
        <table class="billing-table">
          <thead>
            <tr>
              <th>Title ↓</th>
              <th>Date</th>
              <th>Check in</th>
              <th>Check out</th>
              <th>Fee</th>
            </tr>
          </thead>
          <tbody id="billing-table-body"></tbody>
        </table>
      </section>

      <p class="parking-status-note" id="billing-status-message">Loading billing data from Parking_info.xlsx...</p>
    </main>
  </div>
</body>
</html>
